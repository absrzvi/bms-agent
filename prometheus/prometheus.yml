# Prometheus Configuration for BMS Agent
# Constitution §8: Monitoring & Observability

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'bms-agent'
    environment: 'production'

# Alertmanager configuration (optional - for production)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - localhost:9093

# Load rules once and periodically evaluate them
rule_files:
  - "alerts.yml"

scrape_configs:
  # BMS API metrics
  - job_name: 'bms-api'
    static_configs:
      - targets: ['localhost:8000']
    metrics_path: '/metrics/uplink'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Qdrant metrics
  - job_name: 'qdrant'
    static_configs:
      - targets: ['localhost:6333']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # Ollama metrics (if available)
  - job_name: 'ollama'
    static_configs:
      - targets: ['localhost:11434']
    metrics_path: '/metrics'
    scrape_interval: 30s
    # Ollama may not expose metrics - this is optional

  # Node exporter for system metrics (optional)
  # - job_name: 'node'
  #   static_configs:
  #     - targets: ['localhost:9100']
