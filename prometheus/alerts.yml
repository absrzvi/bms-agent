# Prometheus Alert Rules for BMS Agent
# Constitution §8: Monitoring & Observability

groups:
  - name: bms_api_alerts
    interval: 30s
    rules:
      # API Latency Alerts
      - alert: HighAPILatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "High API latency detected"
          description: "p95 latency is {{ $value }}s (threshold: 0.1s)"
          runbook: "Check DEPLOYMENT_CHECKLIST.md - API Latency > 100ms p95 section"

      - alert: CriticalAPILatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 0.5
        for: 2m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "Critical API latency detected"
          description: "p95 latency is {{ $value }}s (threshold: 0.5s)"
          runbook: "IMMEDIATE ACTION REQUIRED - Restart services if latency > 1s"

      # Error Rate Alerts
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.01
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 1%)"
          runbook: "Review /workspace/logs/api.log for errors"

      - alert: CriticalErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "Critical error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 5%)"
          runbook: "IMMEDIATE ACTION - Check service health and logs"

      # Request Rate Alerts
      - alert: LowRequestRate
        expr: rate(http_requests_total[5m]) < 0.1
        for: 10m
        labels:
          severity: info
          component: api
        annotations:
          summary: "Low request rate detected"
          description: "Request rate is {{ $value }} req/s (may indicate service issue)"

  - name: bms_dependencies
    interval: 30s
    rules:
      # Qdrant Health
      - alert: QdrantDown
        expr: up{job="qdrant"} == 0
        for: 1m
        labels:
          severity: critical
          component: qdrant
        annotations:
          summary: "Qdrant is down"
          description: "Qdrant has been unreachable for 1 minute"
          runbook: "Run: ./scripts/start_qdrant.sh restart"

      # Ollama Health
      - alert: OllamaDown
        expr: up{job="ollama"} == 0
        for: 2m
        labels:
          severity: warning
          component: ollama
        annotations:
          summary: "Ollama is down"
          description: "Ollama has been unreachable for 2 minutes"
          runbook: "Check: systemctl status ollama or restart via scripts"

  - name: bms_ingestion
    interval: 60s
    rules:
      # Document Processing
      - alert: DocumentProcessingFailures
        expr: rate(document_processing_failures_total[10m]) > 0.1
        for: 5m
        labels:
          severity: warning
          component: processor
        annotations:
          summary: "High document processing failure rate"
          description: "Failure rate: {{ $value }} failures/s (threshold: 0.1/s)"
          runbook: "Check DEPLOYMENT_CHECKLIST.md - Document Ingestion Failure section"

      - alert: LowProcessingThroughput
        expr: rate(documents_processed_total[5m]) < 0.083
        for: 10m
        labels:
          severity: info
          component: processor
        annotations:
          summary: "Low document processing throughput"
          description: "Throughput: {{ $value }} docs/s (< 5 docs/min threshold)"
          runbook: "Check system resources and Qdrant performance"

  - name: bms_system
    interval: 60s
    rules:
      # Disk Space
      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes{mountpoint="/workspace"} / node_filesystem_size_bytes{mountpoint="/workspace"}) < 0.1
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "Low disk space on /workspace"
          description: "Available: {{ $value | humanizePercentage }} (threshold: 10%)"
          runbook: "Clean up old backups or expand storage"

      - alert: CriticalDiskSpace
        expr: (node_filesystem_avail_bytes{mountpoint="/workspace"} / node_filesystem_size_bytes{mountpoint="/workspace"}) < 0.05
        for: 2m
        labels:
          severity: critical
          component: system
        annotations:
          summary: "Critical disk space on /workspace"
          description: "Available: {{ $value | humanizePercentage }} (threshold: 5%)"
          runbook: "IMMEDIATE ACTION - Free up disk space"

      # Memory Usage
      - alert: HighMemoryUsage
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) < 0.1
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "High memory usage"
          description: "Available memory: {{ $value | humanizePercentage }} (threshold: 10%)"
          runbook: "Check for memory leaks, restart services if needed"
