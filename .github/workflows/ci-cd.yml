name: BMS Agent CI/CD Pipeline

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**']
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: '3.11'

jobs:
  # Pre-commit hooks validation
  pre-commit:
    name: Pre-commit Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install pre-commit
        run: pip install pre-commit
      
      - name: Run pre-commit hooks
        run: pre-commit run --all-files

  # Code quality and security
  quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    needs: pre-commit
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          pip install bandit safety
      
      - name: Run Bandit security scan
        run: bandit -r api/ scripts/ -f json -o bandit-report.json || true
      
      - name: Upload Bandit report
        uses: actions/upload-artifact@v3
        with:
          name: bandit-report
          path: bandit-report.json
      
      - name: Run Safety dependency check
        run: safety check --json --output safety-report.json || true
        env:
          SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}
      
      - name: Upload Safety report
        uses: actions/upload-artifact@v3
        with:
          name: safety-report
          path: safety-report.json

  # Unit and integration tests
  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    needs: pre-commit
    services:
      qdrant:
        image: qdrant/qdrant:v1.7.4
        ports:
          - 6333:6333
        options: >-
          --health-cmd "curl -f http://localhost:6333/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
      
      - name: Run tests with coverage
        run: |
          pytest -v --cov=./ --cov-report=xml --cov-report=term-missing
        env:
          QDRANT_HOST: localhost
          QDRANT_PORT: 6333
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
      
      - name: Check coverage threshold
        run: |
          coverage report --fail-under=80

  # Performance baseline validation
  performance:
    name: Performance Baseline
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    services:
      qdrant:
        image: qdrant/qdrant:v1.7.4
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install locust
      
      - name: Start API server
        run: |
          uvicorn api.main:app --host 0.0.0.0 --port 8000 &
          sleep 10
        env:
          QDRANT_HOST: localhost
          QDRANT_PORT: 6333
      
      - name: Run performance tests
        run: |
          locust -f tests/performance/load/test_locust.py \
            --headless -u 20 -r 5 -t 2m \
            --host http://localhost:8000 \
            --json > performance-results.json || true
      
      - name: Upload performance results
        uses: actions/upload-artifact@v3
        with:
          name: performance-results
          path: performance-results.json

  # Retrieval accuracy evaluation
  evaluation:
    name: Retrieval Accuracy
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    services:
      qdrant:
        image: qdrant/qdrant:v1.7.4
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run retrieval evaluation
        run: |
          python scripts/evaluate_retrieval.py --threshold 0.95
        env:
          QDRANT_HOST: localhost
          QDRANT_PORT: 6333
      
      - name: Check accuracy threshold
        run: |
          # Script should exit with non-zero if accuracy < 95%
          echo "Retrieval accuracy validation complete"

  # Build validation (placeholder for container builds)
  build:
    name: Build Validation
    runs-on: ubuntu-latest
    needs: [quality, test]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    steps:
      - uses: actions/checkout@v4
      
      - name: Validate project structure
        run: |
          echo "Validating project structure..."
          test -f requirements.txt
          test -f api/main.py
          test -f scripts/init_qdrant.py
          echo "Project structure validation passed"
      
      # Placeholder for container build
      # - name: Build Docker image
      #   run: docker build -t bms-agent:${{ github.sha }} .
      
      # Placeholder for image push
      # - name: Push to registry
      #   run: |
      #     echo ${{ secrets.REGISTRY_PASSWORD }} | docker login -u ${{ secrets.REGISTRY_USERNAME }} --password-stdin
      #     docker push bms-agent:${{ github.sha }}

  # Deployment placeholder
  deploy:
    name: Deploy (Placeholder)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Deployment placeholder
        run: |
          echo "Deployment step placeholder"
          echo "For RunPod deployment, configure:"
          echo "  - RUNPOD_USER and RUNPOD_HOST secrets"
          echo "  - SSH deployment key"
          echo "  - Run: rsync -avz --exclude='.git' . \$RUNPOD_USER@\$RUNPOD_HOST:/workspace/001-bms-agent/"
      
      # Placeholder for actual deployment
      # - name: Deploy to RunPod
      #   env:
      #     DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      #   run: |
      #     echo "$DEPLOY_KEY" > deploy_key
      #     chmod 600 deploy_key
      #     rsync -avz -e "ssh -i deploy_key" --exclude='.git' . ${{ secrets.RUNPOD_USER }}@${{ secrets.RUNPOD_HOST }}:/workspace/001-bms-agent/
      #     ssh -i deploy_key ${{ secrets.RUNPOD_USER }}@${{ secrets.RUNPOD_HOST }} "cd /workspace/001-bms-agent && ./scripts/start_all_services.sh restart"

  # Summary job
  summary:
    name: CI/CD Summary
    runs-on: ubuntu-latest
    needs: [pre-commit, quality, test]
    if: always()
    steps:
      - name: Check job statuses
        run: |
          echo "Pre-commit: ${{ needs.pre-commit.result }}"
          echo "Quality: ${{ needs.quality.result }}"
          echo "Test: ${{ needs.test.result }}"
          
          if [ "${{ needs.pre-commit.result }}" != "success" ] || \
             [ "${{ needs.quality.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ]; then
            echo "❌ CI/CD pipeline failed"
            exit 1
          else
            echo "✅ CI/CD pipeline passed"
          fi
