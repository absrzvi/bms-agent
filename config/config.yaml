log_level: INFO

storage:
  storage_path: /root/persistent/qdrant_storage
  snapshots_path: /root/persistent/qdrant_storage/snapshots
  on_disk_payload: true
  wal:
    wal_capacity_mb: 32
    wal_segments_ahead: 0

service:
  host: 0.0.0.0
  http_port: 6333
  grpc_port: 6334
  enable_cors: true
  max_request_size_mb: 32
  max_workers: 0
  http_timeout_sec: 60

cluster:
  enabled: false

telemetry_disabled: true
